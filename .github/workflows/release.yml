name: Release and Publish to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
      notes:
        description: 'Changelog / Release Notes'
        required: false
        default: 'Bản phát hành ổn định cho RustSale CRM'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles deb
          - os: macos-14
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-14
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (toolchain input defaults to stable)
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            libfuse2

      - name: Install dependencies
        run: bun install

      - name: Build Cloak Runtime sidecar
        run: bun run build:cloak-runtime
        env:
          SKIP_CLEAN_ROOM_SMOKE: '1'
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Setup Private Signing Key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.tauri
          umask 077
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY" > ~/.tauri/rustsale.key
          chmod 600 ~/.tauri/rustsale.key || true

      - name: Setup .env for Frontend Build
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VIETQR_BANK_ID: ${{ vars.VITE_VIETQR_BANK_ID || 'ICB' }}
          VITE_VIETQR_ACCOUNT_NO: ${{ vars.VITE_VIETQR_ACCOUNT_NO || '101874355801' }}
          VITE_VIETQR_ACCOUNT_NAME: ${{ vars.VITE_VIETQR_ACCOUNT_NAME || 'TRAN TRONG TRI' }}
        run: |
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_ANON_KEY"
            printf 'VITE_VIETQR_BANK_ID=%s\n' "$VITE_VIETQR_BANK_ID"
            printf 'VITE_VIETQR_ACCOUNT_NO=%s\n' "$VITE_VIETQR_ACCOUNT_NO"
            printf 'VITE_VIETQR_ACCOUNT_NAME=%s\n' "$VITE_VIETQR_ACCOUNT_NAME"
          } > .env

      - name: Build Tauri Desktop App & Sign
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VIETQR_BANK_ID: ${{ vars.VITE_VIETQR_BANK_ID || 'ICB' }}
          VITE_VIETQR_ACCOUNT_NO: ${{ vars.VITE_VIETQR_ACCOUNT_NO || '101874355801' }}
          VITE_VIETQR_ACCOUNT_NAME: ${{ vars.VITE_VIETQR_ACCOUNT_NAME || 'TRAN TRONG TRI' }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        with:
          tagName: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.event.inputs.version || github.ref_name) }}
          releaseName: ${{ startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.event.inputs.version || github.ref_name) }}
          releaseBody: ${{ github.event.inputs.notes || 'Bản phát hành cập nhật cho RustSale CRM' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_URL: https://rustsale.trantrongtri.com
          R2_BUCKET_NAME: rustsale-releases
          R2_ENDPOINT: https://94af112d3d793eb10ab906f0bf8254cd.r2.cloudflarestorage.com
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          RELEASE_NOTES: ${{ github.event.inputs.notes || 'Bản phát hành cập nhật cho RustSale CRM' }}
        run: |
          bun run scripts/publish-release.ts --skip-build
