[package]
name = "rustsale-crm"
version = "0.1.0"
description = "RustSale CRM & Outreach Pro"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rustsale_crm_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
libc = "0.2"
sha2 = "0.10"
infer = "0.16"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
async-trait = "0.1"
futures-util = "0.3"
percent-encoding = "2.3"
psl = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
scraper = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
cdp-lite = "0.1"
rand = "0.8"
aes-gcm = "0.10"
keyring = "2.3"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
zca-rs = { path = "vendor/zca-rs" }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io", "codec"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }
zip = { version = "5.1.1", default-features = false, features = ["deflate-flate2"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
dirs = "5"
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
minisign-verify = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
