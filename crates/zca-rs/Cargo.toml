[package]
name = "zca-rs"
version = "0.1.0"
edition = "2021"
description = "A port of the unofficial Zalo client library zca-js to Rust"
license = "MIT"
repository = "https://github.com/RFS-ADRENO/zca-rs"
readme = "README.md"
keywords = ["zalo", "client", "api", "chat", "bot"]
categories = ["api-bindings", "web-programming::websocket"]


[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
flate2 = "1.0"
md-5 = "0.10"
uuid = { version = "1.8", features = ["v4"] }
base64 = "0.22"
urlencoding = "2.1"
thiserror = "1.0"
url = "2.5"
futures-util = "0.3"
log = "0.4"
image = { version = "0.25", optional = true }
http = "1.4"
chrono = "0.4"

[features]
default = []
image-metadata = ["dep:image"]

[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
implicit_clone = "warn"
undocumented_unsafe_blocks = "warn"
unused_result_ok = "warn"
multiple_crate_versions = "allow"
